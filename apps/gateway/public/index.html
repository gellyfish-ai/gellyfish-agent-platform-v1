<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gellyfish</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/chat.css">
  <link rel="stylesheet" href="/css/tasks.css">
  <link rel="stylesheet" href="/css/profiles.css">
  <link rel="stylesheet" href="/css/credentials.css">
  <link rel="stylesheet" href="/css/diagnostics.css">
</head>
<body>
  <header>
    <button class="nav-menu-btn" id="hamburger-btn" title="Menu">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <button class="new-chat-header-btn" id="header-new-chat-btn" title="New Chat">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <!-- Nav items: hidden, used by JS for appMenuItems + hamburger menu -->
    <nav class="app-menu" style="display:none">
      <a href="/" class="app-menu-item app-menu-icon" data-view="new-chat" title="New Chat">+</a>
      <a href="/conversations" class="app-menu-item" data-view="conversations">Conversations</a>
      <a href="/sessions" class="app-menu-item" data-view="sessions">Sessions</a>
      <a href="/profiles" class="app-menu-item" data-view="profiles">Profiles</a>
      <a href="/crews" class="app-menu-item" data-view="crews">Crews</a>
      <a href="/credentials" class="app-menu-item" data-view="credentials">Credentials</a>
      <a href="/mcps" class="app-menu-item" data-view="mcps">MCPs</a>
      <a href="/approvals" class="app-menu-item" data-view="approvals">Approvals</a>
      <a href="/diagnostics" class="app-menu-item" data-view="diagnostics">Diagnostics</a>
    </nav>
    <div class="tab-bar" id="tab-bar"></div>
    <button class="pending-approvals-btn" id="pending-approvals-btn" title="Pending approvals" style="display:none">
      <span class="pending-approvals-icon">&#x1F510;</span>
      <span class="pending-approvals-count" id="pending-approvals-count">0</span>
    </button>
    <span class="status disconnected" id="status" style="cursor:pointer" title="Click for connection log">Connecting...</span>
    <button class="menu-btn" id="system-status-btn" title="System Status">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
    </button>
    <button class="menu-btn" id="session-info-btn" title="Session Info">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </button>
  </header>

  <!-- Connection Log Panel -->
  <div id="connection-log" class="connection-log hidden">
    <div id="connection-log-entries"></div>
  </div>

  <!-- Chat View -->
  <div id="chat-view">
    <div id="messages">
      <div class="empty-state">
        <h2>Welcome to Gellyfish</h2>
        <p>Your personal AI assistant with full tool access.<br>Type a message to get started.</p>
      </div>
    </div>

    <div id="input-area">
      <div id="input-options">
        <label class="toggle-label" title="Automatically approve all tool permission requests">
          <input type="checkbox" id="auto-approve-toggle" checked />
          <span>Auto-approve</span>
        </label>
      </div>
      <div id="quote-preview">
        <span class="quote-preview-text"></span>
        <button type="button" class="quote-preview-cancel" title="Cancel reply">&times;</button>
      </div>
      <form id="input-form">
        <div id="image-preview-area"></div>
        <div id="audio-preview-area"></div>
        <div id="recording-indicator"></div>
        <div id="input-row">
          <button type="button" id="attach-btn" title="Attach file">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
          </button>
          <input type="file" id="attach-file-input" accept="image/*,.pdf,.txt,.csv,.json,.md,.js,.ts,.py,.xml,.yaml,.yml,.html,.css,.log,.sh,.env,.toml,.ini,.cfg,.sql" multiple style="display:none" />
          <button type="button" id="record-btn" title="Record voice message">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
          <select id="voice-language" title="Transcription language">
            <option value="en">EN</option>
            <option value="es">ES</option>
            <option value="ca">CA</option>
            <option value="ja">JA</option>
          </select>
          <textarea id="message-input" placeholder="Type your message..." autocomplete="off" autofocus rows="1"></textarea>
          <div id="history-buttons">
            <button type="button" id="history-up" title="Previous message">&#x25B2;</button>
            <button type="button" id="history-down" title="Next message">&#x25BC;</button>
          </div>
          <button type="submit" id="send-btn">Send</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Sessions View (legacy) -->
  <div id="sessions-view" class="page-view"></div>

  <!-- Conversations View -->
  <div id="conversations-view" class="page-view"></div>

  <!-- Profiles View -->
  <div id="profiles-view" class="page-view"></div>

  <!-- Crews View -->
  <div id="crews-view" class="page-view"></div>

  <!-- Credentials View -->
  <div id="credentials-view" class="page-view"></div>

  <!-- MCPs View -->
  <div id="mcps-view" class="page-view"></div>

  <!-- Approvals Admin View -->
  <div id="approvals-view" class="page-view"></div>

  <!-- Diagnostics View -->
  <div id="diagnostics-view" class="page-view"></div>

  <!-- Tab/Session Info Modal -->
  <div class="modal-overlay" id="tab-info-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="tab-info-title">Tab Info</h2>
        <button class="modal-close" id="tab-info-close-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div id="tab-info-content"></div>
    </div>
  </div>

  <!-- Session Picker Modal -->
  <div class="modal-overlay" id="session-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>Sessions</h2>
        <button class="modal-close" id="session-modal-close-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <button class="new-session-btn" id="new-session-btn">+ New Session</button>
      <div class="modal-section">
        <label>Profiles</label>
        <div id="profile-list" style="margin-bottom: 1rem;"></div>
        <button class="new-session-btn" id="new-profile-modal-btn" style="margin-bottom: 0;">+ New Profile</button>
      </div>
      <div class="modal-section">
        <label>Recent Sessions</label>
        <div class="session-list" id="session-list">
          <div class="sessions-loading">Loading sessions...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tool Detail Modal -->
  <div class="modal-overlay" id="tool-detail-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="tool-detail-title">Tool Details</h2>
        <button class="modal-close" id="tool-detail-close-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="tool-detail-content" id="tool-detail-content"></div>
    </div>
  </div>

  <!-- System Status Modal -->
  <div class="modal-overlay" id="system-status-modal">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2>System Status</h2>
        <button class="modal-close" id="system-status-close-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div id="system-status-content"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="/js/app.js"></script>
  <script src="/js/system-status.js" defer></script>
</body>
</html>
