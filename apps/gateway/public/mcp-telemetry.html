<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Telemetry - Gellyfish</title>
  <link rel="stylesheet" href="/css/base.css">
  <style>
    body { padding: 24px; max-width: 1200px; margin: 0 auto; height: auto; overflow: auto; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
    .controls select { padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    .controls .refresh-info { color: var(--text-muted); font-size: 0.85rem; }
    .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .card .label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .card .value { font-size: 1.8rem; font-weight: 600; margin-top: 4px; }
    .card .value.error { color: var(--danger-text); }
    .card .value.ok { color: var(--success-text); }
    table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    th { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    td { font-size: 0.9rem; }
    .section-title { font-size: 1.1rem; margin: 24px 0 12px; }
    .alert-banner { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text); padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .alert-banner .dismiss { float: right; cursor: pointer; font-weight: bold; }
    .empty { color: var(--text-muted); font-style: italic; padding: 16px 0; }
    .error-rate { color: var(--danger-text); font-weight: 600; }
  </style>
</head>
<body>
  <div id="alert-banner" class="alert-banner">
    <span class="dismiss" onclick="this.parentElement.style.display='none'">&times;</span>
    <strong>Anomaly Detected</strong>
    <div id="alert-details"></div>
  </div>

  <h1>MCP Telemetry</h1>
  <div class="controls">
    <label>Window:
      <select id="window-select">
        <option value="1">Last 1h</option>
        <option value="6">Last 6h</option>
        <option value="24" selected>Last 24h</option>
        <option value="168">Last 7d</option>
      </select>
    </label>
    <span class="refresh-info">Auto-refresh every 30s</span>
  </div>

  <div class="summary-cards">
    <div class="card"><div class="label">Total Calls</div><div class="value" id="total-calls">-</div></div>
    <div class="card"><div class="label">Error Rate</div><div class="value" id="error-rate">-</div></div>
    <div class="card"><div class="label">Avg Latency</div><div class="value" id="avg-latency">-</div></div>
    <div class="card"><div class="label">p95 Latency</div><div class="value" id="p95-latency">-</div></div>
  </div>

  <h2 class="section-title">By MCP Server</h2>
  <table id="mcp-table">
    <thead><tr><th>MCP</th><th>Calls</th><th>Error Rate</th><th>Avg Latency</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2 class="section-title">By Tool</h2>
  <table id="tool-table">
    <thead><tr><th>MCP</th><th>Tool</th><th>Calls</th><th>Error Rate</th><th>Avg (ms)</th><th>p95 (ms)</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2 class="section-title">Recent Errors</h2>
  <div id="errors-container"></div>

  <script>
    const windowSelect = document.getElementById('window-select');
    let refreshTimer;

    async function fetchDashboard() {
      const hours = windowSelect.value;
      try {
        const res = await fetch(`/api/telemetry/dashboard?window_hours=${hours}`);
        const data = await res.json();
        render(data);
      } catch (err) {
        console.error('Failed to fetch dashboard:', err);
      }
    }

    function render(d) {
      document.getElementById('total-calls').textContent = d.totalCalls.toLocaleString();

      const rateEl = document.getElementById('error-rate');
      const ratePct = (d.errorRate * 100).toFixed(1) + '%';
      rateEl.textContent = ratePct;
      rateEl.className = 'value ' + (d.errorRate > 0.1 ? 'error' : 'ok');

      document.getElementById('avg-latency').textContent = d.avgDurationMs != null ? d.avgDurationMs + 'ms' : '-';
      document.getElementById('p95-latency').textContent = d.p95DurationMs != null ? d.p95DurationMs + 'ms' : '-';

      const mcpBody = document.querySelector('#mcp-table tbody');
      mcpBody.innerHTML = d.byMcp.length === 0 ? '<tr><td colspan="4" class="empty">No data</td></tr>' :
        d.byMcp.map(m => `<tr>
          <td>${esc(m.mcp_name)}</td>
          <td>${m.call_count}</td>
          <td class="${m.error_rate > 0.1 ? 'error-rate' : ''}">${(m.error_rate * 100).toFixed(1)}%</td>
          <td>${m.avg_duration_ms != null ? m.avg_duration_ms + 'ms' : '-'}</td>
        </tr>`).join('');

      const toolBody = document.querySelector('#tool-table tbody');
      toolBody.innerHTML = d.byTool.length === 0 ? '<tr><td colspan="6" class="empty">No data</td></tr>' :
        d.byTool.map(t => `<tr>
          <td>${esc(t.mcp_name)}</td>
          <td>${esc(t.tool_name)}</td>
          <td>${t.call_count}</td>
          <td class="${t.error_rate > 0.1 ? 'error-rate' : ''}">${(t.error_rate * 100).toFixed(1)}%</td>
          <td>${t.avg_duration_ms != null ? t.avg_duration_ms : '-'}</td>
          <td>${t.p95_duration_ms != null ? t.p95_duration_ms : '-'}</td>
        </tr>`).join('');

      const errContainer = document.getElementById('errors-container');
      if (d.recentErrors.length === 0) {
        errContainer.innerHTML = '<div class="empty">No recent errors</div>';
      } else {
        errContainer.innerHTML = '<table><thead><tr><th>MCP</th><th>Tool</th><th>Error Code</th><th>Time</th></tr></thead><tbody>' +
          d.recentErrors.map(e => `<tr>
            <td>${esc(e.mcp_name)}</td>
            <td>${esc(e.tool_name)}</td>
            <td>${esc(e.error_code || '-')}</td>
            <td>${esc(e.started_at || '-')}</td>
          </tr>`).join('') + '</tbody></table>';
      }
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    windowSelect.addEventListener('change', fetchDashboard);
    fetchDashboard();
    refreshTimer = setInterval(fetchDashboard, 30_000);

    // WebSocket anomaly alerts
    try {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${location.host}/api/ws`);
      ws.onmessage = (evt) => {
        try {
          const msg = JSON.parse(evt.data);
          if (msg.type === 'mcp_anomaly_alerts' && msg.alerts?.length > 0) {
            const banner = document.getElementById('alert-banner');
            const details = document.getElementById('alert-details');
            details.innerHTML = msg.alerts.map(a => `<div>${esc(a.message)}</div>`).join('');
            banner.style.display = 'block';
          }
        } catch {}
      };
    } catch {}
  </script>
</body>
</html>
